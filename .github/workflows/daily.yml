name: 매일 브리핑

# 수집 → 요약 → 업종분류 → 텔레그램 발송을 하루 한 번 돌린다.
#
# **Render 가 없어도 돈다.** 이 작업은 DB(Neon)에 직접 붙어 CLI 를 실행하므로
# 웹 API 서버와 무관하다. Render 는 사이트를 보여주는 역할이고, 데이터를 채우는
# 것은 여기다. 둘을 묶어 두면 한쪽이 죽을 때 다른 쪽도 멈춘다.
#
# 필요한 시크릿 (Settings → Secrets and variables → Actions)
#   TAXBRIEFING_DATABASE_URL        필수. postgresql+psycopg://... (드라이버 접두어 포함)
#   TAXBRIEFING_LAW_API_OC          없으면 법령 수집만 건너뛴다
#   TAXBRIEFING_AI_API_KEY          없으면 요약·분류만 건너뛴다
#   TAXBRIEFING_NAVER_CLIENT_ID     없으면 뉴스 수집만 건너뛴다
#   TAXBRIEFING_NAVER_CLIENT_SECRET
#   TAXBRIEFING_TELEGRAM_BOT_TOKEN  없으면 발송만 건너뛴다
#   TAXBRIEFING_TELEGRAM_CHAT_ID
#
# 시크릿이 없으면 **실패가 아니라 건너뜀**이다. 아직 준비 안 된 단계 때문에
# 매일 실패 메일이 오면 진짜 실패를 놓치게 된다.

on:
  schedule:
    # 00:00 UTC = 09:00 KST. 사장님이 출근해서 확인하는 시각에 맞춘다.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: '최근 며칠 공포분을 수집할지'
        default: '14'
      send:
        description: '텔레그램으로 실제 발송할지'
        type: boolean
        default: false

env:
  TAXBRIEFING_ENVIRONMENT: production
  TAXBRIEFING_DATABASE_URL: ${{ secrets.TAXBRIEFING_DATABASE_URL }}
  TAXBRIEFING_LAW_API_OC: ${{ secrets.TAXBRIEFING_LAW_API_OC }}
  TAXBRIEFING_AI_PROVIDER: groq
  TAXBRIEFING_AI_MODEL: openai/gpt-oss-120b
  TAXBRIEFING_AI_API_KEY: ${{ secrets.TAXBRIEFING_AI_API_KEY }}
  TAXBRIEFING_ASSEMBLY_API_KEY: ${{ secrets.TAXBRIEFING_ASSEMBLY_API_KEY }}
  TAXBRIEFING_NAVER_CLIENT_ID: ${{ secrets.TAXBRIEFING_NAVER_CLIENT_ID }}
  TAXBRIEFING_NAVER_CLIENT_SECRET: ${{ secrets.TAXBRIEFING_NAVER_CLIENT_SECRET }}
  TAXBRIEFING_TELEGRAM_BOT_TOKEN: ${{ secrets.TAXBRIEFING_TELEGRAM_BOT_TOKEN }}
  TAXBRIEFING_TELEGRAM_CHAT_ID: ${{ secrets.TAXBRIEFING_TELEGRAM_CHAT_ID }}
  TAXBRIEFING_SITE_URL: https://taxbriefing.vercel.app

jobs:
  briefing:
    runs-on: ubuntu-latest
    # 요약이 무료 한도에 걸리면 재시도하며 기다린다. 넉넉히 준다.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # pip 캐시는 쓰지 않는다.
      #
      # `cache: pip` 를 켰더니 시크릿이 없어 설치 단계를 건너뛴 실행에서
      # **Post Run setup-python 이 실패**했다. 저장할 캐시가 없는데 저장하려
      # 했기 때문이다. 그 결과 "건너뜀"으로 끝나야 할 실행이 빨간불이 됐고,
      # 실패 메일이 오지 않게 하려던 설계가 그대로 무너졌다.
      #
      # 의존성은 작고 하루 한 번 도는 작업이다. 캐시로 아끼는 시간보다
      # 실패 경로가 하나 늘어나는 비용이 크다.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 어떤 시크릿이 있고 없는지 **요약에 적는다.**
      # 지난번엔 전부 건너뛴 채 실패로 끝났는데, 로그를 열어 보기 전에는
      # 무엇이 없어서 그런지 알 수 없었다. 실행 결과 화면에서 바로 보여야 한다.
      - name: 준비 상태 확인
        id: ready
        run: |
          have() { [ -n "$1" ] && echo "있음" || echo "없음"; }
          {
            echo "### 시크릿 상태"
            echo ""
            echo "| 항목 | 상태 |"
            echo "| --- | --- |"
            echo "| DATABASE_URL | $(have "$TAXBRIEFING_DATABASE_URL") |"
            echo "| LAW_API_OC | $(have "$TAXBRIEFING_LAW_API_OC") |"
            echo "| AI_API_KEY | $(have "$TAXBRIEFING_AI_API_KEY") |"
            echo "| NAVER_CLIENT_ID | $(have "$TAXBRIEFING_NAVER_CLIENT_ID") |"
            echo "| TELEGRAM_BOT_TOKEN | $(have "$TAXBRIEFING_TELEGRAM_BOT_TOKEN") |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$TAXBRIEFING_DATABASE_URL" ]; then
            echo "TAXBRIEFING_DATABASE_URL 시크릿이 없습니다. 등록 전까지 건너뜁니다."
            echo "db=false" >> "$GITHUB_OUTPUT"
          else
            echo "db=true" >> "$GITHUB_OUTPUT"
          fi
          [ -n "$TAXBRIEFING_AI_API_KEY" ] && echo "ai=true" >> "$GITHUB_OUTPUT" || echo "ai=false" >> "$GITHUB_OUTPUT"
          [ -n "$TAXBRIEFING_TELEGRAM_BOT_TOKEN" ] && echo "tg=true" >> "$GITHUB_OUTPUT" || echo "tg=false" >> "$GITHUB_OUTPUT"

      # 배치 작업에는 JWT 가 필요 없다. 토큰을 발급하지도 검증하지도 않는다.
      #
      # 그런데 설정은 production 환경에서 약한 JWT 시크릿을 거부하고, 그 검증이
      # get_settings() 안에 있다. 모든 CLI 가 그걸 부르므로 **네 단계가 전부**
      # ValueError 로 죽었다. continue-on-error 가 앞의 셋을 초록으로 보이게 해서
      # 발송 단계 하나만 실패한 것처럼 읽혔다.
      #
      # 실행마다 새로 만든다. 이 값으로 발급된 토큰은 아무 데도 남지 않으므로
      # 실행 간에 이어질 이유가 없고, 시크릿을 하나 더 등록하게 만들 이유도 없다.
      - name: 배치용 JWT 시크릿 생성
        if: steps.ready.outputs.db == 'true'
        run: echo "TAXBRIEFING_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: 설치
        if: steps.ready.outputs.db == 'true'
        run: pip install ./backend

      - name: 수집
        id: collect
        if: steps.ready.outputs.db == 'true'
        working-directory: backend
        # 출처 하나가 죽어도 나머지는 돌아야 한다. 수집 실패로 요약까지 멈추지 않는다.
        continue-on-error: true
        run: python -m app.collect --days "${{ inputs.days || '14' }}" --limit 120

      - name: 요약
        id: summarize
        if: steps.ready.outputs.db == 'true' && steps.ready.outputs.ai == 'true'
        working-directory: backend
        # AI 무료 한도에 걸리는 날이 있다. 그건 고장이 아니라 예정된 일이라
        # 실패로 만들지 않는다. 밀린 것은 다음 날 이어서 처리된다.
        continue-on-error: true
        # 하루 20만 토큰이고 한 건에 4,500 쯤 든다. 40건이면 여유가 있다.
        run: python -m app.summarize --limit 40 --pace 12

      - name: 업종 분류
        id: classify
        if: steps.ready.outputs.db == 'true' && steps.ready.outputs.ai == 'true'
        working-directory: backend
        continue-on-error: true
        run: python -m app.classify --limit 40 --pace 8

      - name: 발송 미리보기
        id: preview
        if: steps.ready.outputs.db == 'true'
        working-directory: backend
        continue-on-error: true
        run: python -m app.notify --hours 26

      # **continue-on-error 는 실패를 감춘다.**
      # 지난 실행에서 네 단계가 전부 exit 1 이었는데 셋이 초록으로 보였고,
      # 발송 하나만 실패한 것처럼 읽혔다. 원인을 찾는 데 그만큼 돌아갔다.
      # 각 단계 결과를 요약에 적고, 전부 실패했으면 실행을 실패로 만든다 —
      # 일부 실패는 정상 운영이지만 전부 실패는 고장이다.
      - name: 결과 정리
        if: steps.ready.outputs.db == 'true'
        run: |
          {
            echo ""
            echo "### 실행 결과"
            echo ""
            echo "| 단계 | 결과 |"
            echo "| --- | --- |"
            echo "| 수집 | ${{ steps.collect.outcome }} |"
            echo "| 요약 | ${{ steps.summarize.outcome }} |"
            echo "| 업종 분류 | ${{ steps.classify.outcome }} |"
            echo "| 발송 미리보기 | ${{ steps.preview.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.collect.outcome }}" != "success" ] \
          && [ "${{ steps.preview.outcome }}" != "success" ]; then
            echo "수집과 발송이 모두 실패했습니다. 설정이나 연결 문제입니다."
            exit 1
          fi

      - name: 텔레그램 발송
        # 예약 실행일 때만 실제로 보낸다. 수동 실행은 확인용이므로
        # send 를 명시적으로 켜지 않는 한 보내지 않는다 — 발송은 되돌릴 수 없다.
        if: |
          steps.ready.outputs.db == 'true' && steps.ready.outputs.tg == 'true' &&
          (github.event_name == 'schedule' || inputs.send)
        working-directory: backend
        run: python -m app.notify --hours 26 --send
