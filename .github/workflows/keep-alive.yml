name: Keep API awake

# Render 무료 티어는 15분 무요청 시 절전한다. 깨어나는 데 30~60초가 걸리므로
# 아침 첫 방문자가 그대로 기다리게 된다.
#
# 자동 실행은 **꺼져 있다.** 백엔드가 Render 에 올라간 뒤에 켠다.
# 백엔드가 없는 상태로 10분마다 돌면 Actions 사용량만 쓰고 아무것도 하지 않는다.
#
# 켤 때는 아래 두 줄의 주석을 푼다.
#   schedule:
#     - cron: '*/10 * * * *'
#
# 참고: Render 는 절전 회피 목적의 자가 핑을 권장하지 않는다.
# 실사용 단계에서는 유료 플랜으로 올리는 편이 안전하다.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL 시크릿이 없습니다. 건너뜁니다."
            exit 0
          fi
          # 절전에서 깨어나는 시간을 고려해 넉넉히 기다린다.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$API_BASE_URL/health" || echo 000)
          echo "health -> $code"
          [ "$code" = "200" ]
