name: Collect official sources

# 법령 원문 수집. Render 무료 티어에는 Cron Job 이 없어 여기서 돌린다.
#
# 수집 자체는 컨테이너 안에서 도는 것이 아니라 이 러너에서 API 를 통해
# 트리거한다 — 러너가 DB 에 직접 붙지 않으므로 접속 정보를 노출하지 않는다.
on:
  schedule:
    # UTC 기준. 평일 KST 09시·13시·17시.
    - cron: '0 0,4,8 * * 1-5'
  workflow_dispatch:
    inputs:
      days:
        description: '최근 며칠 공포분을 수집할지'
        default: '30'

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Wake API
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          [ -n "$API_BASE_URL" ] || { echo "API_BASE_URL 없음"; exit 1; }
          curl -s --max-time 120 "$API_BASE_URL/health" > /dev/null || true

      - name: Trigger collection
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_ADMIN_ID: ${{ secrets.API_ADMIN_ID }}
          API_ADMIN_PASSWORD: ${{ secrets.API_ADMIN_PASSWORD }}
        run: |
          set -e
          if [ -z "$API_ADMIN_ID" ] || [ -z "$API_ADMIN_PASSWORD" ]; then
            echo "관리자 계정 시크릿이 없습니다. 건너뜁니다."
            exit 0
          fi

          token=$(curl -s --max-time 60 -X POST "$API_BASE_URL/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$API_ADMIN_ID\",\"password\":\"$API_ADMIN_PASSWORD\"}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin).get("access_token",""))')

          if [ -z "$token" ]; then
            echo "로그인에 실패했습니다."
            exit 1
          fi

          echo "로그인 성공. 수집 실행 엔드포인트는 S2 에서 추가됩니다."
          # TODO(S2): POST /api/v1/sources/{id}/runs 로 출처별 수집을 트리거한다.
          #           현재는 `python -m app.collect` 를 서버에서 직접 실행해야 한다.
