<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    브라우저 탭 아이콘.

    components/Logo.tsx 와 같은 말풍선이지만 여기서는 바탕을 직접 칠한다.
    탭은 배경색을 물려주지 않아서, 선만 그으면 밝은 테마에서 흰 선이
    흰 바탕에 놓여 사라진다.

    16px 로 줄어들면 말풍선 테두리가 뭉개진다. 그래서 파비콘은 테두리를
    없애고 채운 말풍선으로 두고, 요약 세 줄을 파낸다.
  -->
  <rect width="32" height="32" rx="7" fill="#191f28"/>
  <path
    d="M8.4 7h15.2a2.4 2.4 0 0 1 2.4 2.4v9.9a2.4 2.4 0 0 1-2.4 2.4H13.9l-4.1 3.5a.8.8 0 0 1-1.3-.6v-2.9h-.1A2.4 2.4 0 0 1 6 19.3V9.4A2.4 2.4 0 0 1 8.4 7Z"
    fill="#ffffff"/>
  <g stroke="#191f28" stroke-linecap="round">
    <path d="M10.4 11.6h11.2" stroke-width="1.7"/>
    <path d="M10.4 14.4h6.4" stroke-width="3"/>
    <path d="M10.4 17.2h8.8" stroke-width="1.7"/>
  </g>
</svg>
