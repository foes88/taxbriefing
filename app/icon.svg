<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    브라우저 탭 아이콘.

    components/Logo.tsx 와 같은 검인이지만 여기서는 바탕을 직접 칠한다.
    탭은 배경색을 물려주지 않아서, 선만 그으면 밝은 테마에서 흰 선이
