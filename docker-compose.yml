services:
  db:
    image: postgres:16-alpine
    container_name: taxbriefing-db
    environment:
      POSTGRES_USER: taxbriefing
      POSTGRES_PASSWORD: taxbriefing
      POSTGRES_DB: taxbriefing
    ports:
      - "5433:5432"
    volumes:
      - taxbriefing-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxbriefing -d taxbriefing"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: taxbriefing-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 원문·첨부·발송 스냅샷 객체 저장 (§6.1). 운영에서는 S3 호환 스토리지로 교체한다.
  minio:
    image: minio/minio:latest
    container_name: taxbriefing-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: taxbriefing
      MINIO_ROOT_PASSWORD: taxbriefing
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - taxbriefing-minio:/data

volumes:
  taxbriefing-db:
  taxbriefing-minio:
